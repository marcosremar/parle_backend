version: '3.8'

# Docker Compose para agregação de logs com Loki + Grafana
# Uso: docker-compose -f docker/docker-compose.yml -f docker/docker-compose.logging.yml up -d

services:
  loki:
    image: grafana/loki:latest
    container_name: parle-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../logs:/var/log/parle:ro
      - loki-data:/loki
    networks:
      - parle-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: parle-promtail
    volumes:
      - ../logs:/var/log/parle:ro
      - ../docs/logging/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - parle-network
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: parle-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../docs/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - parle-network
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  parle-network:
    external: true
