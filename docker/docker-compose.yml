version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: parle-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./parle.db
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - parle-network

  api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: parle-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - ../logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - parle-network
    profiles:
      - dev

  redis:
    image: redis:7-alpine
    container_name: parle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parle-network

volumes:
  redis-data:
    driver: local

networks:
  parle-network:
    driver: bridge
