name: parle_backend
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24.0
  - pyyaml>=6.0.0
  - pip:
    # Core FastAPI stack
    - fastapi>=0.104.1
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.5.0
    - pydantic-settings>=2.0.0
    
    # Logging
    - loguru>=0.7.2
    
    # HTTP clients
    - aiohttp>=3.9.1
    - httpx>=0.24.0
    - requests>=2.31.0
    
    # WebSocket support
    - websockets>=12.0
    
    # Database
    - sqlalchemy>=2.0.23
    - aiosqlite>=0.19.0
    - redis>=5.0.0
    
    # Authentication & Security
    - PyJWT>=2.8.0
    - passlib[bcrypt]>=1.7.4
    - cryptography>=41.0.0
    
    # Form data handling
    - python-multipart>=0.0.9
    
    # TTS providers
    - elevenlabs>=2.23.0
    - huggingface_hub>=0.26.2
    - gtts>=2.5.0
    
    # ML/AI libraries
    - openai>=1.3.0
    - sentence-transformers>=2.2.2
    - scikit-learn>=1.3.2
    - python-Levenshtein>=0.23.0
    
    # NLP
    - spacy>=3.7.0
    
    # Audio processing
    - soundfile>=0.12.1
    - librosa>=0.10.1
    
    # File handling
    - aiofiles>=23.0.0
    - b2sdk>=1.20.0
    
    # Template engine
    - jinja2>=3.1.2
    
    # PyTorch (install separately if needed for GPU)
    # torch>=2.0.0
    # torchaudio>=2.1.0
    # transformers>=4.35.2
    
    # Viber gateway (optional)
    - viberbot>=1.0.12
    - pydub>=0.25.1
    - ffmpeg-python>=0.2.0
    - Pillow>=10.0.0
