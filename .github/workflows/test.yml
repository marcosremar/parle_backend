name: Run Tests

on:
  push:
    branches: [ main, develop, monolito-modular ]
  pull_request:
    branches: [ main, develop, monolito-modular ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-timeout
    
    - name: Run tests
      run: |
        python -m pytest \
          tests/unit/ \
          tests/integration/ \
          tests/performance/ \
          tests/robustness/ \
          tests/quality/ \
          tests/regression/ \
          -v \
          --tb=short \
          --maxfail=10 \
          --durations=10 \
          -q
    
    - name: Generate test report
      if: always()
      run: |
        python -m pytest \
          tests/unit/ \
          tests/integration/ \
          tests/performance/ \
          tests/robustness/ \
          tests/quality/ \
          tests/regression/ \
          --tb=no \
          -q \
          --co -q | tail -1
