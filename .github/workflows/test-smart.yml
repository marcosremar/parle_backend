# Workflow de Testes Inteligente
# Roda testes rápidos em feature branches, completos em PRs/main

name: Smart Tests

on:
  push:
    branches: ['*']  # Todas as branches
  pull_request:
    branches: [ main, develop, monolito-modular ]

jobs:
  test-quick:
    # Testes rápidos em feature branches (commits intermediários)
    name: Quick Tests (Feature Branches)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/monolito-modular'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'  # Cache de dependências
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run quick tests
      run: |
        # Apenas testes unitários, mais rápidos
        python -m pytest tests/unit/ -v --tb=short --maxfail=5
        # ~2-3 minutos

  test-full:
    # Testes completos em PRs e branches principais
    name: Full Tests (PRs/Main)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/monolito-modular'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']  # Apenas uma versão para economizar tempo
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run all tests with coverage
      run: |
        python -m pytest \
          tests/unit/ \
          tests/integration/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          -v \
          --tb=short \
          --maxfail=10
        # ~4-5 minutos
