name: Code Quality

on:
  push:
    branches: [ main, develop, monolito-modular ]
  pull_request:
    branches: [ main, develop, monolito-modular ]
  workflow_dispatch:

jobs:
  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install ruff
        run: pip install ruff>=0.1.8
      
      - name: Run ruff
        run: ruff check src/

  format:
    name: Code Formatting (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install black
        run: pip install black>=24.1.1
      
      - name: Check formatting
        run: black --check --line-length=100 src/

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy>=1.8.0 types-all
      
      - name: Run mypy
        run: mypy src/ --ignore-missing-imports || true

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            tests/unit/ tests/integration/ \
            -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install bandit
        run: pip install bandit>=1.7.5
      
      - name: Run bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
      
      - name: Install pip-audit
        run: pip install pip-audit>=2.6.0
      
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
